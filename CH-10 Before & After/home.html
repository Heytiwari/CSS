<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Effect</title>
    <style>
      .card {
        height: 80px;
        width: 200px;
        background-color: bisque;
        border-radius: 10px;
        transition: all 1s ease;
        transform-style: preserve-3d;
        perspective: 1000px;
        position: relative;
        cursor: pointer;
      }

      .front,
      .back {
        backface-visibility: hidden;
        position: absolute;
        height: 100%;
        width: 100%;
        text-align: center;
        align-content: center;
        border-radius: 10px;
      }

      .card:hover {
        transform: rotateY(180deg);
      }

      .back {
        transform: rotateY(180deg);
        background-color: blueviolet;
        color: #fff;
      }

      button {
        height: 50px;
        width: 120px;
        margin-top: 20px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.5s ease;
        z-index: 1;
      }
      span {
        position: relative;
        z-index: 3;
      }

      button::before {
        content: "";
        height: 100%;
        width: 100%;
        background-color: transparent;
        position: absolute;
        border-radius: 50px;
        top: 0;
        left: 0;
        transform: translateX(-100px);
        transition: all 0.5s ease;
        z-index: 2;
      }

      button:hover::before {
        transform: translateX(0);
        background-color: black;
        /* opacity: 0.7; */
      }

      button:hover {
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="front">What is HTML ?</div>
      <div class="back">HyperText Markup Language</div>
    </div>

    <button>
      <span>Click Me</span>
    </button>
  </body>
</html>
