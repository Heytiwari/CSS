<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>

    <style>
        .container {
            background-color: antiquewhite;
            border: 1px solid black;
            height: 8000px;
        }

        img {
            height: 300px;
            width: 300px;
            margin: 10px;
        }

        img:nth-child(2) {
            /* position: relative;
            top: 100px;
            left: 200px; */
            /* position: absolute;
            top: 200px; */
        }

        .post4 {
            position: fixed;
        }

        .post3 {
            position: sticky;
            top: 100px;
        }

        .box {
            background-color: aquamarine;
            height: 5000px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="img/post1.jpg" class="post1" alt="post 1">
        <img src="img/post2.jpg" class="post2" alt="post 2">
        <img src="img/post3.jpg" class="post3" alt="post 3">
        <img src="img/post4.jpg" class="post4" alt="post 4">
    </div>

    <div class="box"></div>
</body>

</html>
